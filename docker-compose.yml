services:
  postgres:
    image: postgres:16-alpine
    container_name: fitstack-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: fitstack
      POSTGRES_PASSWORD: fitstack
      POSTGRES_DB: fitstack
    volumes:
      - fitstack_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitstack -d fitstack"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  fitstack_pg_data:
